<style>*{box-sizing:border-box}body{margin:0;background:#102c25;color:#e6edd7;font:16px/1.6 system-ui,sans-serif}main{max-width:1380px;margin:auto;padding:34px 24px}h1{font:44px Georgia,serif;margin:0}p{max-width:800px;color:#bad1b9}a{color:#d9e6ad}figure{margin:26px 0}#compare{position:relative;overflow:hidden;aspect-ratio:1918/918;border:1px solid #66876b;border-radius:12px;background:#375640}#compare img{position:absolute;width:100%;height:100%;object-fit:cover}#after{clip-path:inset(0 0 0 var(--split,45%))}.labels{display:flex;justify-content:space-between;margin:12px 0}label{display:block}input{width:100%;accent-color:#c8dda0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid img{width:100%;border-radius:10px}.phone{max-width:300px;width:100%;border-radius:10px}figcaption{color:#bbd0b6}.footer{display:flex;gap:22px;flex-wrap:wrap;margin:28px 0}@media(max-width:650px){main{padding:24px 14px}h1{font-size:34px}.grid{grid-template-columns:1fr}}</style>
<main><h1>The trees stay whole</h1><p>Trees and bushes keep their full shape when the traveler walks behind them. Foreground leaves and branches naturally cover the character. There is no opening that follows the character through the tree.</p>
<figure><div id="compare"><img src="before.png" alt="Before: a hole in the tree follows the traveler"><img id="after" src="after/rain-tree-avenue.png" alt="After: the tree keeps its complete painted crown over the traveler"></div><div class="labels"><span>Previous opening</span><span>Full tree</span></div><label for="split">Slide to compare the same Rain Tree Avenue location</label><input id="split" type="range" min="0" max="100" value="45"></figure>
<div class="grid"><figure><img src="after/pond-low.png" alt="Opaque tree beside the pond on Low quality" loading="lazy"><figcaption>Low quality</figcaption></figure><figure><img src="after/pond-high.png" alt="Opaque tree beside the pond on High quality" loading="lazy"><figcaption>High quality</figcaption></figure><figure><img src="after/grove.png" alt="Full painted trees along the forest path" loading="lazy"><figcaption>Forest path</figcaption></figure><figure><img src="after/meadow.png" alt="Blue flowers beneath full painted canopies" loading="lazy"><figcaption>Blue flower meadow</figcaption></figure></div>
<figure><img class="phone" src="after/phone.png" alt="Full trees and shadows on a phone viewport" loading="lazy"><figcaption>Phone framing</figcaption></figure>
